services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-inversiones_lr}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-inversiones_lr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inversiones_lr}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      JWT_EXPIRACION_MINUTOS: ${JWT_EXPIRACION_MINUTOS:-60}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  pgdata:

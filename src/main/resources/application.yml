spring:
  application:
    name: inversiones-lr-backend
  autoconfigure:
    # Sin usuario en memoria por defecto: los usuarios viven en la tabla usuario.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inversiones_lr}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

seguridad:
  jwt:
    # Obligatorio: mínimo 32 caracteres. Sin valor, la aplicación no arranca.
    secreto: ${JWT_SECRET:}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}
  cors:
    origenes-permitidos: ${FRONTEND_URL:http://localhost:4200}
  admin-inicial:
    # Si no existe ningún ADMINISTRADOR y ambos tienen valor, se crea al arrancar.
    correo: ${ADMIN_CORREO:}
    contrasena: ${ADMIN_CONTRASENA:}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

name: CI

# Corre en cada push de cualquier rama (historia, feature, develop, main) y en cada PR.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar, probar, SonarCloud y Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud necesita el historial completo

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compilar, ejecutar pruebas y generar cobertura (JaCoCo)
        run: mvn -B verify

      - name: Verificar que existe el secret SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Falta el secret SONAR_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # Con qualitygate.wait=true, si el Quality Gate falla este paso termina en error (RNF-MAN-001).
      - name: Análisis SonarCloud y Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=MarianaDuran2903_PS1_PROYECTO_INVERSIONES_LR_BACKEND
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
